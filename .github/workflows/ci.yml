name: CI

# Lint, unit tests and smoke test on every push to main and every pull request,
# with the pinned Homebridge version, the latest release and Homebridge 1.x.
# Weekly CVE and Homebridge checks: see compat.yml.
on:
  push:
    branches: [main] # version tags are tested by the publish workflow
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Node ${{ matrix.node }} / Homebridge ${{ matrix.homebridge }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
        homebridge: ["devDependency", "latest", "1"]
        exclude:
          # Homebridge 1.x supports Node.js up to 24; on Node 26 npm would fall back to a very old 1.x release
          - node: 26
            homebridge: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Install Homebridge ${{ matrix.homebridge }}
        if: matrix.homebridge != 'devDependency'
        run: npm install --no-save homebridge@${{ matrix.homebridge }}
      - run: npm run lint
      - run: npm test
      - name: Smoke test with simulated devices
        run: node scripts/smoke-test.mjs
      - name: Upload smoke test log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-test-node${{ matrix.node }}-hb${{ matrix.homebridge }}
          path: smoke-test.log
          if-no-files-found: ignore
