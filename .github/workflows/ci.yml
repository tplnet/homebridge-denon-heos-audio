name: CI

# Runs on every push / pull request and weekly, so new Homebridge releases and
# newly published vulnerabilities (CVEs) are noticed even without code changes.
on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC
  workflow_dispatch:

jobs:
  audit:
    name: Security audit (CVE)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: npm audit (all dependencies)
        run: npm audit
      - name: npm audit (runtime dependencies only)
        run: npm audit --omit=dev

  test:
    name: Node ${{ matrix.node }} / Homebridge ${{ matrix.homebridge }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        homebridge: ["devDependency", "latest", "1"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Install Homebridge ${{ matrix.homebridge }}
        if: matrix.homebridge != 'devDependency'
        run: npm install --no-save homebridge@${{ matrix.homebridge }}
      - run: npm run lint
      - run: npm test
      - name: Smoke test with simulated devices
        run: node scripts/smoke-test.mjs
      - name: Upload smoke test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-node${{ matrix.node }}-hb${{ matrix.homebridge }}
          path: smoke-test.log
          if-no-files-found: ignore
