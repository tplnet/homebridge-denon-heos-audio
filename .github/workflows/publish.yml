name: Publish to npm

# Publishes the package to npm and creates the GitHub release when a version tag (v1.2.3) is pushed.
# `npm version <x.y.z>` creates and pushes the tag (see RELEASING.md).
# Uses npm Trusted Publishing (OIDC): no npm token is stored in GitHub, and npm adds a
# provenance statement that links the published version to this repository and commit.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub release
  id-token: write # required for npm Trusted Publishing / provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted Publishing needs npm 11.5.1 or newer
      - name: Update npm
        run: npm install -g npm@latest

      - name: Check that the release tag matches package.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "::error::Release tag ${GITHUB_REF_NAME} does not match package.json version v${VERSION}"
            exit 1
          fi

      - name: Extract the release notes from CHANGELOG.md
        run: |
          VERSION=$(node -p "require('./package.json').version")
          awk -v v="$VERSION" '/^## /{ if (found) exit; if ($2 == v) { found = 1; next } } found' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no section '## ${VERSION}'"
            exit 1
          fi

      - run: npm ci

      - name: Security audit (CVE)
        run: npm audit

      - run: npm run lint
      - run: npm test

      - name: Compatibility smoke test with the latest Homebridge
        run: |
          npm install --no-save homebridge@latest
          node scripts/smoke-test.mjs

      - name: Publish
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" == *-* ]]; then
            # pre-releases (e.g. 1.1.0-beta.1) don't become the default version in the Homebridge UI
            npm publish --tag next
          else
            npm publish
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists."
            exit 0
          fi
          FLAGS=""
          if [[ "$VERSION" == *-* ]]; then FLAGS="--prerelease"; fi
          gh release create "${GITHUB_REF_NAME}" --verify-tag --title "${VERSION}" --notes-file release-notes.md $FLAGS
