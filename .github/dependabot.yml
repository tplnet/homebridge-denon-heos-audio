# Weekly pull requests for dependency and GitHub Actions updates (security updates as soon as available).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
  - package-ecosystem: github-actions
    # also the composite action in .github/actions/ (malware scan)
    directories: ['/', '/.github/actions/*']
    schedule:
      interval: weekly
      day: monday
